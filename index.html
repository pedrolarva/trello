<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="app-header">
        <h1><i class="fab fa-trello"></i> Meu Kanban</h1>
        <button id="add-board-btn" class="btn"><i class="fas fa-plus"></i> Novo Quadro</button>
    </header>

    <main class="board-container" id="board-container">
        <!-- Columns will be generated here by JavaScript -->
    </main>

    <!-- Modal for adding/editing cards -->
    <div id="card-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2 id="modal-title">Adicionar Cartão</h2>
            <form id="card-form">
                <input type="hidden" id="card-id">
                <input type="hidden" id="column-id">
                <div class="form-group">
                    <label for="card-title-input">Título</label>
                    <input type="text" id="card-title-input" required placeholder="Digite o título do cartão">
                </div>
                <div class="form-group">
                    <label for="card-desc-input">Descrição</label>
                    <textarea id="card-desc-input" rows="4" placeholder="Adicione uma descrição mais detalhada..."></textarea>
                </div>
                <div class="form-group">
                    <label for="card-color-input">Cor (opcional)</label>
                    <input type="color" id="card-color-input" value="#ffffff">
                </div>
                <button type="submit" class="btn btn-primary">Salvar</button>
            </form>
        </div>
    </div>

    <!-- Modal for adding/editing columns -->
    <div id="column-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2 id="column-modal-title">Adicionar Lista</h2>
            <form id="column-form">
                <input type="hidden" id="edit-column-id">
                <div class="form-group">
                    <label for="column-title-input">Título da Lista</label>
                    <input type="text" id="column-title-input" required placeholder="Digite o título da lista">
                </div>
                <button type="submit" class="btn btn-primary">Salvar</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
